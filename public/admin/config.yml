# Sveltia CMS configuration: https://sveltiacms.app/en/docs
#
# Review is optional:
# - Save keeps a change as a draft (a pull request with its own Vercel preview link) that can go
#   Draft -> In Review -> Ready -> Publish.
# - "Save and Publish" (in the Save button's menu) skips review and puts a change live straight away.
# Published changes can be undone from the CMS "History" page (public/admin/history.js).
publish_mode:
  type: editorial_workflow
  direct_publish: true

backend:
  name: github
  repo: CompassAILearning/companysite
  branch: main
  # Only token sign-in for now. Without base_url, "Sign In with GitHub" falls back to Netlify's
  # login service, which doesn't work on Vercel (Netlify "Not Found" page).
  # To enable it: deploy Sveltia CMS Authenticator (https://github.com/sveltia/sveltia-cms-auth),
  # set base_url to its URL, and change auth_methods to [oauth, token].
  auth_methods: [token]
  # base_url: https://sveltia-cms-auth.<your-account>.workers.dev

# Link to the live site from the admin header. Update if a custom domain is added.
site_url: https://companysite-zeta.vercel.app

media_folder: public/assets/img
public_folder: /assets/img

# ------------------------------------------------------------------
# Reusable field definitions (YAML anchors)
# ------------------------------------------------------------------
_defs:
  background: &background
    name: background
    label: Background
    widget: select
    default: white
    options:
      - { label: White, value: white }
      - { label: Light gray, value: gray }
      - { label: Brand tint, value: tint }
  anchor: &anchor
    name: anchor
    label: Link target (optional)
    required: false
    hint: "Lets links jump here. E.g. 'pricing' makes /your-page#pricing scroll to this section."
  heading: &heading { name: heading, label: Heading, required: false }
  intro: &intro { name: intro, label: Intro text, required: false, widget: text }
  card_color: &card_color
    name: color
    label: Card color
    widget: select
    default: blue
    options:
      - { label: Blue, value: blue }
      - { label: Green, value: green }
      - { label: Amber, value: amber }
  icon: &icon
    name: icon
    label: Icon
    widget: select
    default: star
    options:
      - { label: Upload document, value: upload }
      - { label: Calendar with question, value: questions }
      - { label: Checklist plan, value: plan }
      - { label: Calendar, value: calendar }
      - { label: Notification bell, value: bell }
      - { label: Star, value: star }
      - { label: Phone, value: phone }
      - { label: Android phone, value: android }
      - { label: Laptop / web, value: web }
  link_list: &link_list
    widget: list
    summary: "{{fields.label}} → {{fields.url}}"
    fields:
      - { name: label, label: Text }
      - { name: url, label: Link, hint: "A page like /about, a section like /#signup, or a full https:// address" }

# ------------------------------------------------------------------
# Section types editors can add to any page
# ------------------------------------------------------------------
_sections: &sections
  name: sections
  label: Page sections
  widget: list
  hint: "Add, remove and drag sections to build the page."
  types:
    - name: hero
      label: Hero (headline + image)
      widget: object
      summary: "Hero: {{fields.headline}}"
      fields:
        - { name: headline, label: Headline }
        - { name: lead, label: Intro text, widget: text, required: false }
        - { name: ctaLabel, label: Button text, required: false }
        - { name: ctaUrl, label: Button link, required: false, default: "#signup" }
        - { name: image, label: Image, widget: image, required: false }
        - { name: imageAlt, label: Image description (for screen readers), required: false }
        - { name: showVideoControls, label: Show video play button on image, widget: boolean, default: false }
        - *anchor

    - name: pageBanner
      label: Page banner (title at top of page)
      widget: object
      summary: "Banner: {{fields.headline}}"
      fields:
        - { name: eyebrow, label: Small label above headline, required: false }
        - { name: headline, label: Headline }
        - { name: lead, label: Intro text, widget: text, required: false }
        - *anchor

    - name: featureCards
      label: Feature cards
      widget: object
      summary: "Cards: {{fields.heading}}"
      fields:
        - *heading
        - *intro
        - name: style
          label: Style
          widget: select
          default: panel
          options:
            - { label: Cards inside a rounded panel, value: panel }
            - { label: Plain cards, value: plain }
        - name: cards
          label: Cards
          widget: list
          summary: "{{fields.title}}"
          fields:
            - { name: title, label: Title }
            - { name: body, label: Text, widget: text }
            - *card_color
        - *background
        - *anchor

    - name: steps
      label: Steps (icons in a row)
      widget: object
      summary: "Steps: {{fields.heading}}"
      fields:
        - *heading
        - name: items
          label: Steps
          widget: list
          summary: "{{fields.label}} {{fields.text}}"
          fields:
            - { name: label, label: "Label (e.g. Step 1:)" }
            - { name: text, label: Text }
            - *icon
        - *background
        - *anchor

    - name: detailedSteps
      label: Detailed steps (with bullet points)
      widget: object
      summary: "Detailed steps: {{fields.heading}}"
      fields:
        - *heading
        - *intro
        - name: items
          label: Steps
          widget: list
          summary: "{{fields.label}} {{fields.title}}"
          fields:
            - { name: label, label: "Label (e.g. Step 1:)" }
            - { name: title, label: Title }
            - { name: body, label: Text, widget: text, required: false }
            - { name: bullets, label: Bullet points, widget: list, required: false, field: { name: bullet, label: Bullet } }
            - *icon
        - *background
        - *anchor

    - name: textImage
      label: Text with image
      widget: object
      summary: "Text + image: {{fields.heading}}"
      fields:
        - *heading
        - { name: body, label: Text, widget: text, required: false, hint: "Leave a blank line between paragraphs" }
        - { name: checklist, label: Checklist (optional), widget: list, required: false, field: { name: item, label: Item } }
        - { name: image, label: Image, widget: image, required: false }
        - { name: imageAlt, label: Image description (for screen readers), required: false }
        - name: imageSide
          label: Image side
          widget: select
          default: right
          options:
            - { label: Right, value: right }
            - { label: Left, value: left }
        - *background
        - *anchor

    - name: quotes
      label: Quotes / testimonials
      widget: object
      summary: "Quotes: {{fields.heading}}"
      fields:
        - *heading
        - *intro
        - name: quotes
          label: Quotes
          widget: list
          summary: "{{fields.attribution}}"
          fields:
            - { name: quote, label: Quote, widget: text }
            - { name: attribution, label: "Who said it (e.g. Biology, Junior)" }
        - *background
        - *anchor

    - name: team
      label: Team
      widget: object
      summary: "Team: {{fields.heading}}"
      fields:
        - *heading
        - *intro
        - name: members
          label: Members
          widget: list
          summary: "{{fields.name}} — {{fields.role}}"
          fields:
            - { name: name, label: Name }
            - { name: role, label: Role }
            - { name: photo, label: Photo (square works best), widget: image, required: false }
        - *background
        - *anchor

    - name: faq
      label: FAQ
      widget: object
      summary: "FAQ: {{fields.heading}}"
      fields:
        - *heading
        - *intro
        - name: items
          label: Questions
          widget: list
          summary: "{{fields.question}}"
          fields:
            - { name: question, label: Question }
            - { name: answer, label: Answer, widget: text }
        - *background
        - *anchor

    - name: table
      label: Table (3 columns)
      widget: object
      summary: "Table: {{fields.heading}}"
      fields:
        - *heading
        - *intro
        - name: columns
          label: Column headings
          widget: object
          fields:
            - { name: col1, label: Column 1 }
            - { name: col2, label: Column 2 }
            - { name: col3, label: Column 3 }
        - name: rows
          label: Rows
          widget: list
          summary: "{{fields.col1}}"
          fields:
            - { name: col1, label: Column 1 }
            - { name: col2, label: Column 2, required: false }
            - { name: col3, label: Column 3, required: false }
        - *background
        - *anchor

    - name: platforms
      label: Download / platform cards
      widget: object
      summary: "Platforms: {{fields.heading}}"
      fields:
        - *heading
        - *intro
        - name: items
          label: Platforms
          widget: list
          summary: "{{fields.name}}"
          fields:
            - { name: name, label: Name }
            - { name: description, label: Description, widget: text }
            - { name: buttonLabel, label: Button text }
            - { name: url, label: Download link, required: false, hint: "The button stays disabled until a link is set and Coming soon is off" }
            - { name: comingSoon, label: Coming soon, widget: boolean, default: true }
            - *icon
            - name: style
              label: Button style
              widget: select
              default: primary
              options:
                - { label: Solid, value: primary }
                - { label: Outline, value: outline }
        - *background
        - *anchor

    - name: signup
      label: Sign-up form (free trial)
      widget: object
      summary: "Sign-up: {{fields.heading}}"
      fields:
        - { name: heading, label: Heading }
        - { name: checklist, label: Checklist, widget: list, field: { name: item, label: Item, widget: text } }
        - { name: tagline, label: Tagline, required: false }
        - { name: buttonLabel, label: Button text, default: Start Free 30-Day Trial }
        - { name: successMessage, label: Message shown after signing up, default: "Thanks! Check your inbox to get started." }
        - { name: anchor, label: Link target, default: signup, hint: "Buttons linking to #signup jump here. Use only one sign-up form per page." }

    - name: cta
      label: Call-to-action band
      widget: object
      summary: "CTA: {{fields.heading}}"
      fields:
        - { name: heading, label: Heading }
        - { name: text, label: Text, widget: text, required: false }
        - { name: buttonLabel, label: Button text, required: false }
        - { name: buttonUrl, label: Button link, required: false, default: "/#signup" }
        - *background
        - *anchor

collections:
  # ---------------- Pages ----------------
  - name: pages
    label: Pages
    label_singular: Page
    description: "Every page on the site. index is the home page. New pages get their address from the title (e.g. 'Pricing' → /pricing). Add new pages to the header or footer under Site settings."
    folder: src/content/pages
    format: json
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Page name, hint: "Used for the page address when the page is first created" }
      - name: seo
        label: Search & sharing
        widget: object
        collapsed: true
        fields:
          - { name: title, label: Browser tab / search title }
          - { name: description, label: Search description, widget: text, required: false }
      - *sections

  # ---------------- Site settings ----------------
  - name: settings
    label: Site settings
    format: json
    files:
      - name: theme
        label: Theme
        file: src/content/settings/theme.json
        fields:
          - name: palette
            label: Color palette
            widget: select
            options:
              - { label: CompassAI Blue, value: compass-blue }
              - { label: Ocean Teal, value: ocean-teal }
              - { label: Royal Purple, value: royal-purple }
              - { label: Graphite, value: graphite }
          - name: font
            label: Font
            widget: select
            options:
              - { label: Figtree, value: figtree }
              - { label: Inter, value: inter }
              - { label: Poppins, value: poppins }
              - { label: Nunito Sans, value: nunito-sans }

      - name: header
        label: Header
        file: src/content/settings/header.json
        fields:
          - { name: logo, label: Logo, widget: image }
          - { name: logoAlt, label: Logo description (for screen readers) }
          - name: layout
            label: Layout
            widget: select
            options:
              - { label: Logo left, links right, value: split }
              - { label: Logo centered above links, value: centered }
          - { name: links, label: Navigation links, <<: *link_list }
          - name: cta
            label: Header button
            widget: object
            fields:
              - { name: show, label: Show a button in the header, widget: boolean, default: false }
              - { name: label, label: Button text, required: false }
              - { name: url, label: Button link, required: false }

      - name: footer
        label: Footer
        file: src/content/settings/footer.json
        fields:
          - { name: logo, label: Logo, widget: image }
          - { name: logoAlt, label: Logo description (for screen readers) }
          - name: layout
            label: Layout
            widget: select
            options:
              - { label: Logo left, link columns right, value: columns }
              - { label: Simple centered, value: simple }
          - { name: tagline, label: Tagline, required: false }
          - name: columns
            label: Link columns
            widget: list
            summary: "{{fields.heading}}"
            hint: "In the Simple layout, links from all columns are shown in one row."
            fields:
              - { name: heading, label: Heading }
              - { name: links, label: Links, <<: *link_list }
